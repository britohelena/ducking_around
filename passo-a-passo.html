<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passo a passo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #EDF1ED;
    --surface: #FFFFFF;
    --ink: #2B3A36;
    --ink-soft: #5C6E68;
    --moss: #6B8F71;
    --moss-soft: #C9D9C6;
    --moss-pale: #E4ECE3;
    --apricot: #E8A87C;
    --apricot-soft: #F6DEC9;
    --line: #DCE4DA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    min-height: 100vh;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border-radius: 20px;
    padding: 32px 28px 28px;
    box-shadow: 0 1px 3px rgba(43,58,54,0.06), 0 8px 24px rgba(43,58,54,0.05);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 28px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 14.5px;
    margin: 0 0 28px;
    line-height: 1.5;
  }

  /* Stepping stones path */
  .path {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 8px;
    position: relative;
    padding: 0 2px;
  }

  .path::before {
    content: '';
    position: absolute;
    left: 24px;
    right: 24px;
    top: 22px;
    height: 2px;
    background: var(--line);
    z-index: 0;
  }

  .day {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
    flex: 1;
  }

  .stone {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--moss-pale);
    border: 2px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
  }

  .day:hover .stone { transform: translateY(-2px); }

  .day.done .stone {
    background: var(--moss);
    border-color: var(--moss);
  }

  .day.today .stone {
    border-color: var(--apricot);
  }

  .day-label {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .day.today .day-label {
    color: var(--ink);
    font-weight: 600;
  }

  .stats {
    display: flex;
    gap: 12px;
    margin: 28px 0 24px;
  }

  .stat {
    flex: 1;
    background: var(--moss-pale);
    border-radius: 14px;
    padding: 14px 16px;
    text-align: center;
  }

  .stat-num {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--ink);
    display: block;
    line-height: 1.1;
  }

  .stat-label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .prompt {
    background: var(--apricot-soft);
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink);
    margin-bottom: 20px;
    display: none;
  }

  .prompt.show { display: block; }

  .prompt strong { font-weight: 600; }

  .choices {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .choice-btn {
    background: var(--surface);
    border: 1.5px solid var(--moss);
    color: var(--moss);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .choice-btn:hover {
    background: var(--moss);
    color: white;
  }

  .footer-note {
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.6;
    padding-top: 4px;
    border-top: 1px solid var(--line);
  }

  .loading {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 40px 0;
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
  <div class="card" id="app">
    <a class="back-link" href="index.html">← Voltar ao início</a>
    <div class="loading">a preparar…</div>
  </div>

<script>
const WEEKDAYS = ['seg','ter','qua','qui','sex','sáb','dom'];
const ACTIVITIES = [
  { key: 'walk', label: '🚶 Caminhada' },
  { key: 'dance', label: '💃 Dança' },
  { key: 'yoga', label: '🧘 Yoga/suave' },
  { key: 'other', label: '✨ Outro' },
];

function isoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getWeekDates() {
  const now = new Date();
  const day = (now.getDay() + 6) % 7; // 0 = Monday
  const monday = new Date(now);
  monday.setDate(now.getDate() - day);
  monday.setHours(0,0,0,0);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d);
  }
  return dates;
}

// ============================================================
// Este ficheiro usa a configuração partilhada em firebase-config.js
// (tem de estar na mesma pasta, e ser carregado antes deste script)
// ============================================================
const TRACKER_DOC_ID = "meu-tracker-2026";
const trackerRef = getTrackerRef(TRACKER_DOC_ID);

let state = { days: {}, totalSessions: 0 };
let openDayKey = null;

async function loadState() {
  try {
    const doc = await trackerRef.get();
    if (doc.exists) {
      state = doc.data();
    }
  } catch (e) {
    console.log('sem dados ainda, ou erro de ligação', e);
  }
}

async function saveState() {
  try {
    await trackerRef.set(state);
  } catch (e) {
    console.error('erro ao guardar', e);
  }
}

function computeStreak() {
  // consecutive days up to today (including today only if done) counting backwards
  let streak = 0;
  let cursor = new Date();
  cursor.setHours(0,0,0,0);
  while (true) {
    const key = isoDate(cursor);
    if (state.days[key]) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

function render() {
  const app = document.getElementById('app');
  const weekDates = getWeekDates();
  const todayKey = isoDate(new Date());
  const doneThisWeek = weekDates.filter(d => state.days[isoDate(d)]).length;
  const streak = computeStreak();

  let pathHtml = '<div class="path">';
  weekDates.forEach((d, i) => {
    const key = isoDate(d);
    const done = !!state.days[key];
    const isToday = key === todayKey;
    pathHtml += `
      <button class="day ${done ? 'done' : ''} ${isToday ? 'today' : ''}" data-key="${key}">
        <div class="stone">${done ? '✓' : ''}</div>
        <div class="day-label">${WEEKDAYS[i]}</div>
      </button>`;
  });
  pathHtml += '</div>';

  let promptHtml = '';
  if (openDayKey) {
    const done = state.days[openDayKey];
    if (done) {
      promptHtml = `
        <div class="prompt show">
          <strong>Registado: ${done.activity || 'movimento'}.</strong> Já contou — não precisas de fazer mais nada hoje.
          <div class="choices"><button class="choice-btn" data-action="undo">desfazer</button></div>
        </div>`;
    } else {
      promptHtml = `
        <div class="prompt show">
          <strong>O que fizeste (ou vais fazer) hoje?</strong> Qualquer coisa a partir de 5 minutos conta.
          <div class="choices">
            ${ACTIVITIES.map(a => `<button class="choice-btn" data-activity="${a.key}">${a.label}</button>`).join('')}
          </div>
        </div>`;
    }
  }

  app.innerHTML = `
    <a class="back-link" href="index.html">← Voltar ao início</a>
    <h1>Passo a passo</h1>
    <p class="subtitle">Sem obrigação de todos os dias. O objetivo é aparecer mais vezes do que desapareces — nada mais.</p>
    ${pathHtml}
    ${promptHtml}
    <div class="stats">
      <div class="stat">
        <span class="stat-num">${streak}</span>
        <span class="stat-label">dias seguidos</span>
      </div>
      <div class="stat">
        <span class="stat-num">${doneThisWeek}/7</span>
        <span class="stat-label">esta semana</span>
      </div>
      <div class="stat">
        <span class="stat-num">${state.totalSessions}</span>
        <span class="stat-label">sessões no total</span>
      </div>
    </div>
    <p class="footer-note">Um dia em branco não apaga os anteriores. Amanhã é sempre uma nova oportunidade, sem contas a acertar.</p>
  `;

  app.querySelectorAll('.day').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      openDayKey = (openDayKey === key) ? null : key;
      render();
    });
  });

  app.querySelectorAll('.choice-btn[data-activity]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const activityKey = btn.dataset.activity;
      const activity = ACTIVITIES.find(a => a.key === activityKey);
      if (!state.days[openDayKey]) {
        state.totalSessions++;
      }
      state.days[openDayKey] = { activity: activity.label };
      await saveState();
      render();
    });
  });

  const undoBtn = app.querySelector('.choice-btn[data-action="undo"]');
  if (undoBtn) {
    undoBtn.addEventListener('click', async () => {
      if (state.days[openDayKey]) {
        delete state.days[openDayKey];
        state.totalSessions = Math.max(0, state.totalSessions - 1);
      }
      await saveState();
      openDayKey = null;
      render();
    });
  }
}

(async function init() {
  render();
  await loadState();
  render();
})();
</script>
</body>
</html>
